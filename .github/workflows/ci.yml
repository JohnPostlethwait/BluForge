name: CI

on:
  # Manual runs build a runnable image for whatever branch is selected; see the
  # image job. Nothing builds one on its own — a dev image is only worth its
  # minutes when someone is about to put a disc in a drive, and CI cannot know
  # that. Actions tab -> CI -> Run workflow -> pick the branch.
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ files
        run: templ generate

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  image:
    name: Build a Dev Image
    # Only ever on request. A push or a pull request runs the tests and stops
    # there, exactly as before.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch name is not a Docker tag. Branches here routinely carry "/"
      # and "+" — the worktrees this project works in produce names like
      # "worktree-fix+state-sync-four" — and both are illegal in a tag, as is a
      # leading "." or "-". metadata-action's type=ref,event=branch would
      # normally handle this, but it is documented for push events and is not
      # guaranteed to fire on workflow_dispatch; a silently missing branch tag
      # is worse than doing the substitution here where it can be read.
      #
      # Read from the environment rather than interpolated into the script:
      # ${{ }} substitution happens before the shell sees the line, so a ref
      # containing shell metacharacters would be executed rather than quoted.
      - name: Derive a tag-safe branch name
        id: branch
        run: |
          slug=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -cs 'A-Za-z0-9_.-' '-' \
            | sed 's/^[.-]*//' \
            | cut -c1-100)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/johnpostlethwait/bluforge
          # latest=false, without exception. This is built from a branch that
          # has not been released and may not even be merged; moving "latest"
          # onto it would upgrade every deployment tracking it.
          flavor: |
            latest=false
          # Two tags doing two jobs. branch- moves as the branch does, so
          # re-pulling after another dispatch picks up the new build. sha- never
          # moves, so a machine can be pinned to exactly the code that was
          # tested on it — which is the whole point of testing a build.
          tags: |
            type=raw,value=branch-${{ steps.branch.outputs.slug }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAKEMKV_VERSION=1.18.3

      # The tags are derived, so say what they came out as rather than making
      # someone reconstruct them from the branch name.
      - name: Report what to pull
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Dev image published'
            echo
            echo 'Not a release: `latest` is untouched and no version tag was created.'
            echo
            echo '```'
            printf '%s\n' "$TAGS" | sed 's/^/docker pull /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
